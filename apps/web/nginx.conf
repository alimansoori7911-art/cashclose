# پیکربندی nginx برای سرو فرانت‌اند و پراکسی به API.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # فشرده‌سازی: بستهٔ JS حدود ۳۸۰ کیلوبایت است و گزیپ آن را به یک‌سوم
    # می‌رساند — روی اینترنت فروشگاه تفاوت محسوسی دارد.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # سقف حجم آپلود عکس رسید. باید از سقف سمت API بزرگ‌تر باشد تا پیام
    # خطای فارسی از برنامه بیاید، نه صفحهٔ ۴۱۳ خود nginx.
    client_max_body_size 10m;

    # هدرهای امنیتی. CSP اینجا تعریف می‌شود چون nginx تنها جایی است که
    # همهٔ پاسخ‌های HTML از آن عبور می‌کنند.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    # درخواست‌های API به بک‌اند می‌روند. نام `api` همان نام سرویس در
    # docker-compose است و داکر خودش آن را به IP کانتینر ترجمه می‌کند.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # آپلود عکس ممکن است کند باشد.
        proxy_read_timeout 120s;
    }

    # فایل‌های دارای hash در نام، هرگز تغییر محتوا نمی‌دهند؛ پس می‌توان
    # طولانی‌مدت کششان کرد.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # مسیریابی سمت کلاینت: هر مسیر ناشناخته به index.html می‌رسد تا
    # React Router خودش تصمیم بگیرد. بدون این، رفرش روی /reports خطای
    # ۴۰۴ می‌داد.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html هرگز کش نمی‌شود: باید همیشه تازه‌ترین نسخه بیاید تا
    # کاربر پس از استقرار جدید، نام فایل‌های تازه را ببیند.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
